n: absolute;\n  z-index: 8;\n  top: 14px;\n  left: 14px;\n  padding: 8px 12px;\n  border: 0;\n  border-radius: 999px;\n  background: rgba(18, 19, 24, 0.9);\n  color: #fff;\n  font-size: 13px;\n  font-weight: 900;\n  cursor: pointer;\n}\n\n.phone-bezel {\n  padding: 9px;\n  border: 1px solid rgba(255, 255, 255, 0.2);\n  border-radius: 38px;\n  background: linear-gradient(145deg, #1f2028, #07080d 48%, #2a2c35);\n  box-shadow: 0 30px 80px rgba(0, 0, 0, 0.46), inset 0 1px 1px rgba(255, 255, 255, 0.22);\n}\n\n.phone-display {\n  position: relative;\n  display: flex;\n  height: min(720px, calc(100vh - 46px));\n  max-height: 720px;\n  min-height: 0;\n  flex-direction: column;\n  overflow: hidden;\n  border-radius: 30px;\n  background:\n    linear-gradient(rgba(255, 255, 255, 0.68), rgba(255, 255, 255, 0.78)),\n    radial-gradient(circle at 35% 71%, rgba(255, 179, 205, 0.74) 0 18%, transparent 38%),\n    radial-gradient(circle at 68% 77%, rgba(184, 218, 255, 0.54) 0 16%, transparent 35%),\n    linear-gradient(180deg, #f4f7fb 0%, #ffffff 55%, #ffeaf2 100%);\n  color: #20232d;\n  box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.08);\n}\n\n.phone-statusbar {\n  position: relative;\n  z-index: 4;\n  display: flex;\n  align-items: center;\n  justify-content: space-between;\n  min-height: 36px;\n  padding: 7px 20px 4px;\n  color: #222630;\n  cursor: grab;\n  font-size: 14px;\n  touch-action: none;\n  user-select: none;\n}\n\n.phone-statusbar:active {\n  cursor: grabbing;\n}\n\n.phone-statusbar strong {\n  font-size: 18px;\n  font-weight: 900;\n  letter-spacing: 0.02em;\n}\n\n.phone-statusbar__icons {\n  display: inline-flex;\n  align-items: center;\n  gap: 7px;\n  font-weight: 800;\n}\n\n.phone-statusbar__icons i {\n  font-size: 12px;\n  font-style: normal;\n}\n\n.phone-notch {\n  position: absolute;\n  z-index: 5;\n  top: 10px;\n  left: 50%;\n  width: 84px;\n  height: 22px;\n  border-radius: 999px;\n  background: rgba(18, 19, 24, 0.92);\n  box-shadow: inset 0 -1px 1px rgba(255, 255, 255, 0.16), 0 3px 8px rgba(0, 0, 0, 0.18);\n  transform: translateX(-50%);\n}\n\n.phone-home-screen,\n.phone-app-screen {\n  position: relative;\n  z-index: 2;\n  display: flex;\n  min-height: 0;\n  flex: 1;\n  flex-direction: column;\n}\n\n.phone-home-screen {\n  padding: 36px 22px 20px;\n}\n\n.phone-wallpaper-mark {\n  display: flex;\n  min-height: 230px;\n  flex-direction: column;\n  justify-content: flex-end;\n  color: rgba(40, 43, 54, 0.22);\n  pointer-events: none;\n}\n\n.phone-wallpaper-bunny {\n  position: absolute;\n  right: 30px;\n  bottom: 126px;\n  color: rgba(255, 151, 190, 0.2);\n  font-size: 210px;\n  font-weight: 900;\n  line-height: 0.8;\n  transform: rotate(-12deg);\n}\n\n.phone-wallpaper-mark strong {\n  font-size: 34px;\n  font-weight: 900;\n  letter-spacing: 0.16em;\n}\n\n.phone-wallpaper-mark em {\n  margin-top: 6px;\n  font-size: 16px;\n  font-style: normal;\n  font-weight: 800;\n  letter-spacing: 0.3em;\n}\n\n.phone-home-grid {\n  display: grid;\n  grid-template-columns: repeat(4, minmax(0, 1fr));\n  gap: 22px 18px;\n  margin-top: 8px;\n}\n\n.phone-dock {\n  display: grid;\n  grid-template-columns: repeat(2, minmax(0, 1fr));\n  gap: 38px;\n  margin-top: auto;\n  padding: 13px 42px 12px;\n  border-radius: 28px;\n  background: rgba(255, 255, 255, 0.72);\n  box-shadow: 0 -4px 26px rgba(255, 165, 195, 0.22), inset 0 1px 0 rgba(255, 255, 255, 0.9);\n  backdrop-filter: blur(12px);\n}\n\n.phone-app {\n  position: relative;\n  display: flex;\n  min-width: 0;\n  flex-direction: column;\n  align-items: center;\n  gap: 7px;\n  padding: 0;\n  border: 0;\n  background: transparent;\n  color: #161923;\n  cursor: pointer;\n  font: inherit;\n  text-align: center;\n}\n\n.phone-app__label {\n  max-width: 76px;\n  overflow: hidden;\n  color: #161923;\n  font-size: 14px;\n  font-weight: 800;\n  line-height: 1.2;\n  text-overflow: ellipsis;\n  text-shadow: 0 1px 2px rgba(255, 255, 255, 0.8);\n  white-space: nowrap;\n}\n\n.phone-app-picture {\n  position: relative;\n  display: inline-flex;\n  align-items: center;\n  justify-content: center;\n  width: 64px;\n  height: 64px;\n  overflow: hidden;\n  border: 3px solid rgba(255, 255, 255, 0.95);\n  border-radius: 21px;\n  background: #fff;\n  box-shadow: 0 7px 12px rgba(22, 25, 35, 0.22), inset 0 1px 0 rgba(255, 255, 255, 0.8);\n}\n\n.phone-app-picture::before,\n.phone-app-picture::after,\n.phone-app-picture__glyph::before,\n.phone-app-picture__glyph::after {\n  position: absolute;\n  content: \'\';\n}\n\n.phone-app-picture--small {\n  width: 36px;\n  height: 36px;\n  border-width: 2px;\n  border-radius: 12px;\n  box-shadow: 0 4px 9px rgba(22, 25, 35, 0.18);\n}\n\n.phone-app-picture--contacts {\n  background: linear-gradient(145deg, #ff94a7, #ffe6ee);\n}\n\n.phone-app-picture--contacts::before {\n  width: 26px;\n  height: 34px;\n  border: 4px solid #222632;\n  border-bottom-color: transparent;\n  border-radius: 16px 16px 18px 18px;\n  transform: rotate(-22deg);\n}\n\n.phone-app-picture--contacts::after {\n  right: 8px;\n  bottom: 6px;\n  width: 20px;\n  height: 20px;\n  border: 3px solid #222632;\n  border-radius: 50%;\n  background: #b8f070;\n}\n\n.phone-app-picture--forum {\n  background: linear-gradient(145deg, #6a6fff, #dce6ff);\n}\n\n.phone-app-picture--forum::before {\n  width: 38px;\n  height: 28px;\n  border-radius: 9px;\n  background: #fff;\n  box-shadow: 0 8px 0 -4px rgba(20, 23, 32, 0.34);\n}\n\n.phone-app-picture--forum::after {\n  right: 12px;\n  bottom: 14px;\n  border-top: 9px solid #fff;\n  border-left: 9px solid transparent;\n}\n\n.phone-app-picture--delivery {\n  background: linear-gradient(145deg, #ff7b35, #ffe4ad);\n}\n\n.phone-app-picture--delivery::before {\n  width: 38px;\n  height: 30px;\n  border: 4px solid #20232d;\n  border-radius: 10px;\n  background: #fff8e4;\n}\n\n.phone-app-picture--delivery::after {\n  top: 17px;\n  width: 23px;\n  height: 5px;\n  border-radius: 999px;\n  background: #ff5f5f;\n  box-shadow: 0 9px 0 #6cc8ff;\n}\n\n.phone-app-picture--tieba {\n  background: linear-gradient(145deg, #78e9cf, #efffff);\n}\n\n.phone-app-picture--tieba::before {\n  width: 34px;\n  height: 34px;\n  border: 4px solid #20232d;\n  border-radius: 50% 50% 45% 55%;\n  background: #cffff2;\n}\n\n.phone-app-picture--tieba::after {\n  right: 10px;\n  bottom: 10px;\n  width: 18px;\n  height: 12px;\n  border-radius: 8px;\n  background: #ff5b70;\n  transform: rotate(-22deg);\n}\n\n.phone-app-picture--taobao {\n  background: linear-gradient(145deg, #ff8c2f, #fff0d7);\n}\n\n.phone-app-picture--taobao::before {\n  width: 34px;\n  height: 38px;\n  border-radius: 9px 9px 13px 13px;\n  background: #ff6b2b;\n  box-shadow: inset 0 -12px 0 rgba(255, 255, 255, 0.22);\n}\n\n.phone-app-picture--taobao::after {\n  top: 15px;\n  width: 18px;\n  height: 10px;\n  border: 3px solid #fff;\n  border-bottom: 0;\n  border-radius: 12px 12px 0 0;\n}\n\n.phone-app-picture--orders {\n  background: linear-gradient(145deg, #f7fbff, #dde8ff);\n}\n\n.phone-app-picture--orders::before {\n  width: 42px;\n  height: 42px;\n  border: 4px solid #20232d;\n  border-radius: 50%;\n  background: linear-gradient(180deg, #ff5f6f 0 45%, #20232d 45% 55%, #fff 55% 100%);\n}\n\n.phone-app-picture--orders::after {\n  width: 13px;\n  height: 13px;\n  border: 3px solid #20232d;\n  border-radius: 50%;\n  background: #fff;\n}\n\n.phone-app em {\n  top: -8px;\n  right: 2px;\n}\n\n.phone-app-header {\n  display: grid;\n  grid-template-columns: 32px 36px minmax(0, 1fr) auto;\n  align-items: center;\n  gap: 9px;\n  padding: 8px 14px 10px;\n  border-bottom: 1px solid rgba(31, 35, 47, 0.08);\n  background: rgba(255, 255, 255, 0.58);\n  backdrop-filter: blur(14px);\n}\n\n.phone-app-header button {\n  width: 30px;\n  height: 30px;\n  border: 0;\n  border-radius: 50%;\n  background: rgba(255, 255, 255, 0.78);\n  color: #20232d;\n  cursor: pointer;\n  font-size: 26px;\n  line-height: 1;\n}\n\n.phone-app-header div {\n  min-width: 0;\n}\n\n.phone-app-header strong,\n.phone-app-header small {\n  display: block;\n  overflow: hidden;\n  text-overflow: ellipsis;\n  white-space: nowrap;\n}\n\n.phone-app-header strong {\n  font-size: 16px;\n  font-weight: 900;\n}\n\n.phone-app-header small,\n.phone-app-header em {\n  color: #737985;\n  font-size: 11px;\n  font-style: normal;\n  font-weight: 800;\n}\n\n.community-status {\n  margin: 0;\n  color: #4d657e;\n  font-size: 12px;\n  line-height: 1.45;\n  overflow-wrap: anywhere;\n}\n\n.community-status--error {\n  color: #b33e4b;\n}\n\n.community-status--success {\n  color: #247c5b;\n}\n\n.phone-screen {\n  min-height: 0;\n  flex: 1;\n  overflow: hidden;\n  background: rgba(250, 252, 255, 0.7);\n}\n\n.phone-view {\n  height: 100%;\n  padding: 12px;\n  overflow-y: auto;\n  box-sizing: border-box;\n}\n\n.phone-view--contacts {\n  display: flex;\n  flex-direction: column;\n  gap: 10px;\n  overflow: hidden;\n}\n\n.contact-list .social-avatar {\n  flex: 0 0 auto;\n}\n\n.contact-list {\n  display: flex;\n  flex-direction: column;\n  gap: 10px;\n}\n\n.contact-list__tools {\n  display: grid;\n  grid-template-columns: minmax(0, 1fr) auto;\n  gap: 8px;\n}\n\n.contact-picker {\n  min-width: 0;\n  padding: 9px 10px;\n  border: 1px solid rgba(31, 35, 47, 0.08);\n  border-radius: 14px;\n  background: rgba(255, 255, 255, 0.82);\n  color: #20232d;\n}\n\n.contact-tool-button {\n  padding: 9px 12px;\n  border: 0;\n  border-radius: 14px;\n  background: linear-gradient(135deg, #ff7896, #ff9e63);\n  color: #fff;\n  cursor: pointer;\n  font-weight: 900;\n  box-shadow: 0 7px 14px rgba(255, 120, 150, 0.24);\n}\n\n.chat-panel__contact-title {\n  display: flex;\n  align-items: center;\n  gap: 8px;\n  min-width: 0;\n}\n\n.contact-row {\n  display: flex;\n  width: 100%;\n  align-items: center;\n  gap: 10px;\n  padding: 10px 12px;\n  border: 0;\n  border-radius: 14px;\n  background: rgba(255, 255, 255, 0.72);\n  color: #454a57;\n  cursor: pointer;\n  box-shadow: 0 5px 14px rgba(35, 40, 55, 0.08);\n  text-align: left;\n}\n\n.contact-row--acti
